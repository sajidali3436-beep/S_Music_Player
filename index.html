<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S Music Player - v2.7 Pro Studio Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-grad-1: #0f1020;
            --bg-grad-2: #1b1c3a;
            --panel-bg: rgba(25, 26, 48, 0.78);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --accent: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --slider-bg: rgba(255, 255, 255, 0.1);
        }

        [data-theme="sunset"] {
            --bg-grad-1: #1f0f12;
            --bg-grad-2: #3a1b22;
            --panel-bg: rgba(48, 25, 30, 0.78);
            --primary: #f43f5e;
            --primary-glow: rgba(244, 63, 94, 0.4);
            --accent: #fbbf24;
        }

        [data-theme="cyberpunk"] {
            --bg-grad-1: #050510;
            --bg-grad-2: #100520;
            --panel-bg: rgba(20, 10, 35, 0.85);
            --primary: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.5);
            --accent: #ec4899;
        }

        [data-theme="emerald"] {
            --bg-grad-1: #051a14;
            --bg-grad-2: #0a2e23;
            --panel-bg: rgba(15, 42, 33, 0.8);
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --accent: #3b82f6;
        }

        [data-theme="oled"] {
            --bg-grad-1: #000000;
            --bg-grad-2: #09090b;
            --panel-bg: rgba(18, 18, 22, 0.9);
            --panel-border: rgba(255, 255, 255, 0.12);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        /* Ambient Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.35;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        .orb-1 { width: 350px; height: 350px; background: var(--primary); top: -100px; left: -100px; }
        .orb-2 { width: 400px; height: 400px; background: var(--accent); bottom: -120px; right: -120px; animation-delay: -6s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 50px) scale(1.1); }
        }

        .app-container {
            position: relative;
            z-index: 2;
            width: 95%;
            max-width: 920px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            display: grid;
            grid-template-columns: 1fr 350px;
            overflow: hidden;
            margin: 20px 0;
        }

        @media(max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
                max-width: 480px;
            }
        }

        /* Left Main Panel */
        .main-panel {
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid var(--panel-border);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }
        .logo i {
            color: var(--primary);
            font-size: 1.4rem;
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 20px;
        }
        .theme-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }
        .theme-dot:hover { transform: scale(1.2); }
        .theme-dot.active { border-color: #fff; }

        /* Vinyl & Cover Art */
        .visualizer-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2px 0 16px 0;
        }

        .vinyl-container {
            position: relative;
            width: 185px;
            height: 185px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 12px #222, inset 0 0 0 24px #1a1a1a, inset 0 0 0 36px #111;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: spin 8s linear infinite;
            animation-play-state: paused;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-grooves {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(#111, #111 3px, #222 4px, #111 5px);
            opacity: 0.6;
            pointer-events: none;
        }

        .album-art-center {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            background-size: cover;
            background-position: center;
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 3px solid rgba(255,255,255,0.2);
        }

        .album-art-center i {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .vinyl-center-hole {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--bg-grad-1);
            border-radius: 50%;
            z-index: 3;
            border: 2px solid #333;
        }

        .glow-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(var(--primary), var(--accent), var(--primary));
            opacity: 0;
            filter: blur(10px);
            z-index: -1;
            transition: opacity 0.3s;
        }
        .vinyl.playing .glow-ring {
            opacity: 0.6;
            animation: pulseGlow 3s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.98); opacity: 0.4; }
            100% { transform: scale(1.04); opacity: 0.7; }
        }

        /* Song Info & Favorite Button */
        .song-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 10px;
        }
        .song-info {
            text-align: left;
            overflow: hidden;
            flex: 1;
        }
        .song-title {
            font-size: 1.1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .song-artist {
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .fav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            padding: 5px;
        }
        .fav-btn:hover { transform: scale(1.15); }
        .fav-btn.active { color: var(--accent); }

        /* Waveform / Audio Visualizer Bars */
        .audio-waves {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 25px;
            margin: 8px 0 2px 0;
        }
        .wave-bar {
            width: 4px;
            background: var(--primary);
            border-radius: 2px;
            height: 6px;
            transition: height 0.1s ease;
        }
        .playing .wave-bar {
            animation: bounceBar 0.8s infinite ease-in-out alternate;
        }
        .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.5s; }
        .wave-bar:nth-child(5) { animation-delay: 0.2s; }
        .wave-bar:nth-child(6) { animation-delay: 0.4s; }
        .wave-bar:nth-child(7) { animation-delay: 0.1s; }

        @keyframes bounceBar {
            0% { height: 6px; }
            100% { height: 24px; }
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 15px;
        }
        .progress-bar-wrapper {
            position: relative;
            width: 100%;
            height: 6px;
            background: var(--slider-bg);
            border-radius: 3px;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .progress-filled {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
        }
        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Main Controls */
        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover { color: var(--primary); transform: scale(1.1); }
        .ctrl-btn.active { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        .play-pause-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-size: 1.1rem;
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .play-pause-btn:hover { transform: scale(1.08); color: #fff; }

        /* Secondary Toolbar */
        .sub-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--panel-border);
            font-size: 0.85rem;
        }
        .volume-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volume-slider {
            width: 65px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .speed-selector {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.75rem;
            padding: 3px 6px;
            cursor: pointer;
            outline: none;
        }
        .speed-selector option {
            background: #111;
            color: #fff;
        }
        .extra-btns {
            display: flex;
            gap: 10px;
        }

        /* EQ Drawer */
        .eq-panel {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
            display: none;
        }
        .eq-panel.show { display: block; }
        .eq-presets {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 8px;
        }
        .eq-preset-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 0.68rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .eq-preset-btn:hover, .eq-preset-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .eq-sliders {
            display: flex;
            justify-content: space-around;
        }
        .eq-band {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            gap: 4px;
        }
        .eq-band input {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 16px;
            height: 55px;
            accent-color: var(--primary);
        }

        /* Right Playlist & Lyrics Panel */
        .side-panel {
            padding: 24px;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.15);
        }

        .side-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
        }
        .side-tab {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            padding-bottom: 4px;
            position: relative;
        }
        .side-tab.active {
            color: var(--text-main);
        }
        .side-tab.active::after {
            content: '';
            position: absolute;
            bottom: -10px; left: 0; width: 100%; height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .tab-content.active {
            display: flex;
        }

        /* Playlist Styles */
        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.8rem;
            margin-bottom: 10px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--primary); }

        .playlist-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }
        .action-btn {
            padding: 7px 4px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .action-btn:hover { background: var(--primary); border-color: var(--primary); color: #fff; }

        .playlist-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .playlist-items::-webkit-scrollbar { width: 4px; }
        .playlist-items::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .playlist-item {
            padding: 9px 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .playlist-item:hover { background: rgba(255,255,255,0.08); }
        .playlist-item.active {
            background: rgba(139, 92, 246, 0.18);
            border-color: var(--primary);
        }
        .playlist-item-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-right: 8px;
            flex: 1;
        }
        .pi-title { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pi-artist { font-size: 0.7rem; color: var(--text-muted); }
        
        .pi-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pi-fav, .pi-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            font-size: 0.8rem;
            transition: color 0.2s;
        }
        .pi-fav:hover { color: var(--accent); }
        .pi-fav.active { color: var(--accent); }
        .pi-delete:hover { color: var(--accent); }

        /* Lyrics Viewer Styles */
        .lyrics-container {
            flex: 1;
            overflow-y: auto;
            text-align: center;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }
        .lyrics-container::-webkit-scrollbar { width: 3px; }
        .lyric-line {
            font-size: 0.95rem;
            color: var(--text-muted);
            transition: all 0.3s;
            cursor: pointer;
            line-height: 1.5;
        }
        .lyric-line:hover { color: var(--text-main); }
        .lyric-line.active {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--primary);
            text-shadow: 0 0 12px var(--primary-glow);
            transform: scale(1.05);
        }
        .no-lyrics {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: auto;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body data-theme="aurora">
    <div class="orb orb-1" id="orb1"></div>
    <div class="orb orb-2" id="orb2"></div>

    <div class="app-container">
        <!-- Main Left Panel -->
        <div class="main-panel">
            <div class="header-bar">
                <div class="logo">
                    <i class="fa-solid fa-compact-disc"></i>
                    <span>S Music Player</span>
                </div>
                <div class="theme-selector">
                    <div class="theme-dot active" style="background: #8b5cf6;" onclick="setTheme('aurora')" title="Aurora"></div>
                    <div class="theme-dot" style="background: #f43f5e;" onclick="setTheme('sunset')" title="Sunset"></div>
                    <div class="theme-dot" style="background: #06b6d4;" onclick="setTheme('cyberpunk')" title="Cyberpunk"></div>
                    <div class="theme-dot" style="background: #10b981;" onclick="setTheme('emerald')" title="Emerald"></div>
                    <div class="theme-dot" style="background: #000000; border-color:#3b82f6;" onclick="setTheme('oled')" title="OLED Black"></div>
                </div>
            </div>

            <!-- Vinyl & Visualizer Stage -->
            <div class="visualizer-stage">
                <div class="vinyl-container" onclick="togglePlay()">
                    <div class="glow-ring"></div>
                    <div class="vinyl" id="vinylDisc">
                        <div class="vinyl-grooves"></div>
                        <div class="album-art-center" id="albumArtCenter">
                            <i class="fa-solid fa-music" id="albumArtIcon"></i>
                        </div>
                        <div class="vinyl-center-hole"></div>
                    </div>
                </div>

                <div class="song-info-row">
                    <div class="song-info">
                        <div class="song-title" id="songTitle">Select or Scan Tracks</div>
                        <div class="song-artist" id="songArtist">S Music Studio v2.7</div>
                    </div>
                    <button class="fav-btn" id="currentFavBtn" onclick="toggleCurrentFavorite()" title="Favorite"><i class="fa-solid fa-heart"></i></button>
                </div>

                <div class="audio-waves" id="audioWaves">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar-wrapper" id="progressBar" onclick="seekAudio(event)">
                    <div class="progress-filled" id="progressFilled"></div>
                </div>
                <div class="time-stamps">
                    <span id="currentTime">00:00</span>
                    <span id="durationTime">00:00</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-row">
                <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle"><i class="fa-solid fa-shuffle"></i></button>
                <button class="ctrl-btn" onclick="prevTrack()" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                <button class="ctrl-btn play-pause-btn" id="playPauseBtn" onclick="togglePlay()"><i class="fa-solid fa-play" id="playIcon"></i></button>
                <button class="ctrl-btn" onclick="nextTrack()" title="Next"><i class="fa-solid fa-forward-step"></i></button>
                <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repeat"><i class="fa-solid fa-repeat"></i></button>
            </div>

            <!-- Sub Toolbar -->
            <div class="sub-controls">
                <div class="volume-box">
                    <i class="fa-solid fa-volume-high" id="muteIcon" onclick="toggleMute()" style="cursor:pointer;"></i>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(this.value)">
                </div>
                <select class="speed-selector" id="speedSelector" onchange="setPlaybackSpeed(this.value)" title="Playback Speed">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                </select>
                <div class="extra-btns">
                    <button class="ctrl-btn" onclick="toggleEq()" title="Equalizer"><i class="fa-solid fa-sliders"></i></button>
                    <button class="ctrl-btn" onclick="openTimerModal()" title="Sleep Timer"><i class="fa-solid fa-moon"></i></button>
                </div>
            </div>

            <!-- EQ Drawer -->
            <div class="eq-panel" id="eqPanel">
                <div class="eq-presets">
                    <button class="eq-preset-btn active" onclick="applyPreset('flat')">Flat</button>
                    <button class="eq-preset-btn" onclick="applyPreset('bass')">Bass Boost</button>
                    <button class="eq-preset-btn" onclick="applyPreset('rock')">Rock</button>
                    <button class="eq-preset-btn" onclick="applyPreset('pop')">Pop</button>
                </div>
                <div class="eq-sliders">
                    <div class="eq-band"><span>Bass</span><input type="range" id="eqBass" min="-10" max="10" value="0" oninput="updateEQ()"></div>
                    <div class="eq-band"><span>Mid</span><input type="range" id="eqMid" min="-10" max="10" value="0" oninput="updateEQ()"></div>
                    <div class="eq-band"><span>Treble</span><input type="range" id="eqTreble" min="-10" max="10" value="0" oninput="updateEQ()"></div>
                </div>
            </div>
        </div>

        <!-- Right Side Panel (Playlist / Lyrics) -->
        <div class="side-panel">
            <div class="side-tabs">
                <button class="side-tab active" onclick="switchTab('playlist')">Playlist</button>
                <button class="side-tab" onclick="switchTab('lyrics')">Lyrics</button>
            </div>

            <!-- Playlist Tab Content -->
            <div class="tab-content active" id="playlistTab">
                <input type="text" class="search-box" id="searchBox" placeholder="Search song or artist..." oninput="filterPlaylist(this.value)">
                <div class="playlist-actions">
                    <button class="action-btn" onclick="scanFolder()"><i class="fa-solid fa-folder-open"></i> Scan Folder</button>
                    <button class="action-btn" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-plus"></i> Add Files</button>
                    <button class="action-btn" onclick="savePlaylist()"><i class="fa-solid fa-download"></i> Save List</button>
                    <button class="action-btn" onclick="document.getElementById('jsonInput').click()"><i class="fa-solid fa-upload"></i> Load List</button>
                    <input type="file" id="fileInput" accept="audio/*" multiple style="display:none" onchange="handleFiles(this.files)">
                    <input type="file" id="jsonInput" accept=".json" style="display:none" onchange="loadPlaylistJSON(this.files[0])">
                </div>
                <div class="playlist-items" id="playlistItems">
                    <div class="no-lyrics" style="margin: auto;">No tracks loaded yet.<br>Click Scan or Add Files.</div>
                </div>
            </div>

            <!-- Lyrics Tab Content -->
            <div class="tab-content" id="lyricsTab">
                <div class="lyrics-container" id="lyricsContainer">
                    <div class="no-lyrics">Play a track to view synchronized karaoke lyrics.</div>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        let playlist = [];
        let filteredPlaylist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;

        const audio = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinylDisc');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const songTitle = document.getElementById('songTitle');
        const songArtist = document.getElementById('songArtist');
        const progressFilled = document.getElementById('progressFilled');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const albumArtCenter = document.getElementById('albumArtCenter');
        const albumArtIcon = document.getElementById('albumArtIcon');
        const currentFavBtn = document.getElementById('currentFavBtn');

        // Web Audio API for EQ
        let audioCtx, sourceNode, bassFilter, trebleFilter;
        function initWebAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    sourceNode = audioCtx.createMediaElementSource(audio);
                    
                    bassFilter = audioCtx.createBiquadFilter();
                    bassFilter.type = 'lowshelf';
                    bassFilter.frequency.value = 250;

                    trebleFilter = audioCtx.createBiquadFilter();
                    trebleFilter.type = 'highshelf';
                    trebleFilter.frequency.value = 4000;

                    sourceNode.connect(bassFilter);
                    bassFilter.connect(trebleFilter);
                    trebleFilter.connect(audioCtx.destination);
                } catch(e) {
                    console.log("Web Audio API not supported", e);
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function updateEQ() {
            initWebAudio();
            if(bassFilter && trebleFilter) {
                const bassVal = document.getElementById('eqBass').value;
                const trebleVal = document.getElementById('eqTreble').value;
                bassFilter.gain.value = bassVal * 1.5;
                trebleFilter.gain.value = trebleVal * 1.5;
            }
        }

        function applyPreset(preset) {
            document.querySelectorAll('.eq-preset-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            const bass = document.getElementById('eqBass');
            const mid = document.getElementById('eqMid');
            const treble = document.getElementById('eqTreble');

            if(preset === 'flat') { bass.value = 0; mid.value = 0; treble.value = 0; }
            else if(preset === 'bass') { bass.value = 8; mid.value = 1; treble.value = 4; }
            else if(preset === 'rock') { bass.value = 6; mid.value = -2; treble.value = 6; }
            else if(preset === 'pop') { bass.value = 3; mid.value = 4; treble.value = 3; }
            updateEQ();
        }

        function setPlaybackSpeed(val) {
            audio.playbackRate = parseFloat(val);
        }

        // Demo tracks init
        const demoTracks = [
            {
                title: "S Nebula",
                artist: "Synthwave Echoes",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                lyrics: "[00:05] Glowing stars in deep space\n[00:12] Echoes of a forgotten time\n[00:20] Feel the rhythm of the nebula\n[00:30] Pure digital harmony",
                isFav: false
            },
            {
                title: "Cybernetic Drift",
                artist: "Neon Skyline",
                url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                lyrics: "[00:04] Midnight rain on glass\n[00:12] Circuit boards and neon lights\n[00:22] Moving fast through the grid\n[00:35] Nothing can stop this drift",
                isFav: true
            }
        ];

        playlist = demoTracks;
        filteredPlaylist = playlist;
        renderPlaylist();
        loadTrack(0);

        function setTheme(themeName) {
            document.body.setAttribute('data-theme', themeName);
            document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
            event.target.classList.add('active');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.side-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tabName === 'playlist') {
                document.querySelectorAll('.side-tab')[0].classList.add('active');
                document.getElementById('playlistTab').classList.add('active');
            } else {
                document.querySelectorAll('.side-tab')[1].classList.add('active');
                document.getElementById('lyricsTab').classList.add('active');
            }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlistItems');
            if(filteredPlaylist.length === 0) {
                container.innerHTML = '<div class="no-lyrics" style="margin: auto;">No tracks found.</div>';
                return;
            }
            container.innerHTML = '';
            filteredPlaylist.forEach((track, index) => {
                const originalIndex = playlist.indexOf(track);
                const item = document.createElement('div');
                item.className = `playlist-item ${originalIndex === currentIndex ? 'active' : ''}`;
                
                item.innerHTML = `
                    <div class="playlist-item-info" onclick="selectTrack(${originalIndex})">
                        <span class="pi-title">${track.title}</span>
                        <span class="pi-artist">${track.artist || 'S Music Track'}</span>
                    </div>
                    <div class="pi-actions">
                        <button class="pi-fav ${track.isFav ? 'active' : ''}" onclick="toggleFavorite(event, ${originalIndex})" title="Favorite"><i class="fa-solid fa-heart"></i></button>
                        <button class="pi-delete" onclick="removeTrack(event, ${originalIndex})" title="Remove"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function filterPlaylist(query) {
            const q = query.toLowerCase();
            filteredPlaylist = playlist.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
            renderPlaylist();
        }

        function selectTrack(index) {
            currentIndex = index;
            loadTrack(currentIndex);
            playAudio();
        }

        function toggleFavorite(e, index) {
            e.stopPropagation();
            playlist[index].isFav = !playlist[index].isFav;
            if(index === currentIndex) {
                updateFavIconState();
            }
            renderPlaylist();
        }

        function toggleCurrentFavorite() {
            if(playlist.length === 0) return;
            playlist[currentIndex].isFav = !playlist[currentIndex].isFav;
            updateFavIconState();
            renderPlaylist();
        }

        function updateFavIconState() {
            if(playlist[currentIndex].isFav) {
                currentFavBtn.classList.add('active');
            } else {
                currentFavBtn.classList.remove('active');
            }
        }

        function removeTrack(e, index) {
            e.stopPropagation();
            playlist.splice(index, 1);
            filteredPlaylist = playlist;
            if(playlist.length === 0) {
                pauseAudio();
                songTitle.innerText = "No Tracks";
                songArtist.innerText = "Playlist Empty";
                audio.src = "";
            } else if(currentIndex >= index && currentIndex > 0) {
                currentIndex--;
            }
            renderPlaylist();
            if(playlist.length > 0) {
                loadTrack(currentIndex);
            }
        }

        function savePlaylist() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(playlist));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "smusic_playlist.json");
            dlAnchorElem.click();
        }

        function loadPlaylistJSON(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loaded = JSON.parse(e.target.result);
                    if(Array.isArray(loaded)) {
                        playlist = loaded;
                        filteredPlaylist = playlist;
                        currentIndex = 0;
                        renderPlaylist();
                        loadTrack(0);
                        alert("Playlist loaded successfully!");
                    }
                } catch(err) {
                    alert("Invalid playlist file.");
                }
            };
            reader.readAsText(file);
        }

        function loadTrack(index) {
            if(playlist.length === 0) return;
            const track = playlist[index];
            audio.src = track.url;
            songTitle.innerText = track.title;
            songArtist.innerText = track.artist || 'Local Audio File';
            
            if(track.art) {
                albumArtCenter.style.backgroundImage = `url(${track.art})`;
                albumArtIcon.style.display = 'none';
            } else {
                albumArtCenter.style.backgroundImage = 'none';
                albumArtIcon.style.display = 'block';
            }

            updateFavIconState();
            parseLyrics(track.lyrics || "[00:00] Instrumental Track\n[00:10] Enjoy S Music Player sound");
            renderPlaylist();
        }

        function togglePlay() {
            initWebAudio();
            if(isPlaying) {
                pauseAudio();
            } else {
                playAudio();
            }
        }

        function playAudio() {
            if(playlist.length === 0) return;
            audio.play().then(() => {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause";
                vinyl.classList.add('playing');
            }).catch(e => console.log(e));
        }

        function pauseAudio() {
            audio.pause();
            isPlaying = false;
            playIcon.className = "fa-solid fa-play";
            vinyl.classList.remove('playing');
        }

        function nextTrack() {
            if(isShuffle) {
                currentIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            loadTrack(currentIndex);
            playAudio();
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            playAudio();
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
        }

        audio.ontimeupdate = () => {
            if(audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFilled.style.width = pct + '%';
                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationTimeEl.innerText = formatTime(audio.duration);
                updateLyricsHighlight(audio.currentTime);
            }
        };

        audio.onended = () => {
            if(isRepeat) {
                audio.play();
            } else {
                nextTrack();
            }
        };

        function seekAudio(e) {
            const rect = document.getElementById('progressBar').getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function setVolume(val) {
            audio.volume = val;
            const icon = document.getElementById('muteIcon');
            if(val == 0) icon.className = "fa-solid fa-volume-xmark";
            else if(val < 0.5) icon.className = "fa-solid fa-volume-low";
            else icon.className = "fa-solid fa-volume-high";
        }

        let lastVol = 0.8;
        function toggleMute() {
            if(audio.volume > 0) {
                lastVol = audio.volume;
                audio.volume = 0;
                document.getElementById('volumeSlider').value = 0;
                document.getElementById('muteIcon').className = "fa-solid fa-volume-xmark";
            } else {
                audio.volume = lastVol;
                document.getElementById('volumeSlider').value = lastVol;
                document.getElementById('muteIcon').className = "fa-solid fa-volume-high";
            }
        }

        function toggleEq() {
            document.getElementById('eqPanel').classList.toggle('show');
        }

        function openTimerModal() {
            let mins = prompt("Set Sleep Timer in minutes (e.g., 15, 30, 60):", "15");
            if(mins && !isNaN(mins)) {
                setTimeout(() => {
                    pauseAudio();
                    alert("Sleep Timer triggered: Music paused.");
                }, parseInt(mins) * 60000);
                alert(`Sleep timer set for ${mins} minutes.`);
            }
        }

        async function scanFolder() {
            if ('showDirectoryPicker' in window) {
                try {
                    const dirHandle = await window.showDirectoryPicker();
                    let newTracks = [];
                    for await (const entry of dirHandle.values()) {
                        if (entry.kind === 'file' && (entry.name.endsWith('.mp3') || entry.name.endsWith('.wav') || entry.name.endsWith('.m4a'))) {
                            const file = await entry.getFile();
                            const url = URL.createObjectURL(file);
                            let title = file.name.replace(/\.[^/.]+$/, "");
                            let artist = "Local Folder";
                            if(title.includes('-')) {
                                let parts = title.split('-');
                                artist = parts[0].trim();
                                title = parts[1].trim();
                            }
                            newTracks.push({ title, artist, url, isFav: false });
                        }
                    }
                    if(newTracks.length > 0) {
                        playlist = newTracks;
                        filteredPlaylist = playlist;
                        currentIndex = 0;
                        loadTrack(0);
                        alert(`Successfully loaded ${newTracks.length} local tracks!`);
                    } else {
                        alert("No audio files found in selected folder.");
                    }
                } catch(e) {
                    console.log(e);
                }
            } else {
                document.getElementById('fileInput').click();
            }
        }

        function handleFiles(files) {
            let newTracks = [];
            for (let file of files) {
                const url = URL.createObjectURL(file);
                let title = file.name.replace(/\.[^/.]+$/, "");
                let artist = "Local File";
                if(title.includes('-')) {
                    let parts = title.split('-');
                    artist = parts[0].trim();
                    title = parts[1].trim();
                }
                newTracks.push({ title, artist, url, isFav: false });
            }
            if(newTracks.length > 0) {
                playlist = playlist.concat(newTracks);
                filteredPlaylist = playlist;
                renderPlaylist();
                if(audio.paused && playlist.length === newTracks.length) {
                    loadTrack(0);
                }
            }
        }

        let parsedLyrics = [];
        function parseLyrics(rawText) {
            parsedLyrics = [];
            const lines = rawText.split('\n');
            const timeRx = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
            
            lines.forEach(line => {
                const match = line.match(timeRx);
                if(match) {
                    const mins = parseInt(match[1]);
                    const secs = parseInt(match[2]);
                    const millis = parseInt(match[3]) || 0;
                    const timeInSec = mins * 60 + secs + millis / 1000;
                    const text = line.replace(timeRx, '').trim();
                    parsedLyrics.push({ time: timeInSec, text });
                } else if(line.trim() !== '') {
                    parsedLyrics.push({ time: 0, text: line.trim() });
                }
            });
            renderLyricsView();
        }

        function renderLyricsView() {
            const container = document.getElementById('lyricsContainer');
            if(parsedLyrics.length === 0) {
                container.innerHTML = '<div class="no-lyrics">No lyrics available.</div>';
                return;
            }
            container.innerHTML = '';
            parsedLyrics.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `lyric-line ${idx === 0 ? 'active' : ''}`;
                div.innerText = item.text;
                div.onclick = () => { audio.currentTime = item.time; };
                container.appendChild(div);
            });
        }

        function updateLyricsHighlight(currTime) {
            if(parsedLyrics.length === 0) return;
            let activeIdx = 0;
            for(let i = 0; i < parsedLyrics.length; i++) {
                if(currTime >= parsedLyrics[i].time) {
                    activeIdx = i;
                } else {
                    break;
                }
            }
            const lines = document.querySelectorAll('.lyric-line');
            lines.forEach((el, idx) => {
                if(idx === activeIdx) {
                    if(!el.classList.contains('active')) {
                        el.classList.add('active');
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    el.classList.remove('active');
                }
            });
        }
    </script>
</body>
</html>
